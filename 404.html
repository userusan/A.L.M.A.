<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — A.L.M.A.</title>
  <!-- Estilos dentro del archivo: GitHub Pages muestra esta página desde
       cualquier ruta, así que no dependemos de rutas relativas. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: radial-gradient(circle at 80% 10%, #D8F2FF 0, transparent 50%), #EAF6FF; color: #1E2B45; padding: 24px; }
    h1 { font-size: 5rem; margin: 0; color: #0B3B82; }
    h1 span { color: #16B5F1; }
    p { color: #58637A; font-size: 1.15rem; }
    a { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 999px;
        background: #0B3B82; color: #fff; text-decoration: none; font-weight: 700; }
    a:hover { background: #16B5F1; }
  </style>
</head>
<body>
  <main>
    <h1>4<span>0</span>4</h1>
    <p>No encontramos esta página, pero seguimos conectados.</p>
    <a id="volver" href="/">Volver al inicio</a>
  </main>
  <script>
    // En un sitio de proyecto (usuario.github.io/repositorio/) el inicio está en /repositorio/
    if (location.hostname.endsWith("github.io")) {
      const partes = location.pathname.split("/").filter(Boolean);
      if (partes.length && !location.hostname.startsWith(partes[0])) {
        document.getElementById("volver").href = "/" + partes[0] + "/";
      }
    }
  </script>
</body>
</html>
